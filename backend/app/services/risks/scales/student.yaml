# Шкалы для роли «Студент»: тяжесть — не штраф, а последствие для понимания темы.
role: student
measure: последствие ошибки понимания для решения учебной задачи
probability:
  1: Ошибка маловероятна — понятие усвоено, вопрос уточняющий
  2: Ошибка возможна в редких формулировках задачи
  3: Ошибка проявляется в типовой задаче
  4: Ошибка повторяется в самопроверке
  5: Ошибка устойчива — повторяется после разбора источника
severity:
  1: Неточность формулировки, на вывод не влияет
  2: Неполный ответ, вывод верный
  3: Неверное решение части задачи
  4: Системное непонимание темы — ошибка воспроизведётся в большинстве смежных вопросов
  5: Смешение базовых понятий темы, ведущее к неверному решению на экзамене
