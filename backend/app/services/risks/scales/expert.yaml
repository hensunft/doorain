# Шкалы для роли «Эксперт»: тяжесть — риск неверного правового вывода.
role: expert
measure: риск неверного правового вывода
probability:
  1: Коллизии и спорного толкования нет, норма однозначна
  2: Спорное толкование возможно в редких обстоятельствах
  3: Есть конкурирующая норма или смежная редакция, требующая проверки
  4: Коллизия или смена редакции прямо затрагивают вывод
  5: Вывод опирается на утратившую силу редакцию или прямо противоречит норме
severity:
  1: Уточнение формулировки без влияния на вывод
  2: Неполнота ссылки, вывод верный
  3: Неверная квалификация части обстоятельств
  4: Неверный вывод по существу вопроса
  5: Вывод, влекущий санкции или утрату права для доверителя
