# Шкалы оценки риска для роли «Предприниматель». Подставляются в промпт извлечения рисков.
# Методика экспериментальная (docs/risk-methodology.md); тексты шкал правит владелец.
role: entrepreneur
measure: правовое последствие для бизнеса
probability:
  1: Практически исключено — нарушения нет, вопрос теоретический
  2: Маловероятно — признаки есть, но наступление зависит от редких условий
  3: Возможно — нарушение есть, выявление зависит от проверки или жалобы
  4: Вероятно — нарушение очевидно, типовой предмет проверок регулятора
  5: Почти неизбежно — нарушение длящееся и видимое извне
severity:
  1: Замечание, устранение без санкции
  2: Штраф в нижней границе, незначительные издержки
  3: Существенный штраф, предписание, переделка процессов
  4: Крупный штраф, приостановление отдельного направления, претензии контрагентов
  5: Блокировка ресурса, запрет деятельности, уголовная ответственность должностных лиц
