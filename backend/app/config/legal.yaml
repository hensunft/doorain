# Реквизиты оператора персональных данных для страниц «Политика обработки персональных данных», «Условия использования»
# и «Контакты». ЗАПОЛНИТЕ ДО ПУБЛИЧНОГО ЗАПУСКА: пустое поле показывается на странице как «не заполнено», а /api/v1/legal
# перечисляет незаполненные поля. Значения не выдумываются — их вносит оператор. Перед внешним запуском сверьте тексты,
# требования 152-ФЗ, локализацию и уведомление Роскомнадзора с юристом.
#
# version меняется вместе с текстами: при регистрации сохраняется, с какой версией пользователь ознакомился.
version: "2026-09-24"
operator:
  name: ""            # полное наименование организации, ИП или ФИО физического лица
  legal_status: ""    # например: общество с ограниченной ответственностью, индивидуальный предприниматель
  inn: ""
  ogrn: ""            # ОГРН или ОГРНИП
  address: ""         # адрес для корреспонденции
  email: ""           # адрес для запросов субъектов персональных данных
  rkn_notice: ""      # регистрационный номер в реестре операторов Роскомнадзора, если уведомление подано
