# Методика оценки рисков (docs/risk-methodology.md). Правит владелец; после правки перезапустите api и worker —
# уровни уже созданных рисков пересчитываются при старте, раскраска матрицы, списка и графа меняется без правки кода.
# Уровень по P × S: ≤ 1-я граница — низкий (low), ≤ 2-я — средний (mid), ≤ 3-я — высокий (high), выше — критический.
# Переменные окружения DOORAIN_RISK_THRESHOLDS и DOORAIN_MAX_NEW_RISKS_PER_ANSWER имеют приоритет над этим файлом.
risk_thresholds: [4, 9, 15]
max_new_risks_per_answer: 3
