# Манифест корпуса DoorAIn: что должно быть загружено, откуда и на каком правовом основании.
#
# Это ПЛАН наполнения, а не утверждение об актуальности или достаточности актов. Перечень собран из
# концепции проекта и не является официальным списком: реквизиты, действующую редакцию и дату
# проверяйте по официальному источнику при загрузке, дата редакции фиксируется в метаданных.
#
# layer:   1 — нормативные правовые акты (единственно допустимое основание риска)
#          2 — правоприменение и официальные разъяснения (помечается отдельно от нормы)
#          3 — доктрина и учебная литература (не может быть основанием риска)
# license: public_domain_official — официальный документ (п. 6 ст. 1259 ГК РФ, охране не подлежит)
#          open_license          — открытая лицензия (CC и т. п.), указать в license_note
#          owned_copy            — экземпляр, которым владелец располагает на законных основаниях
# Документ без license не индексируется: `doorain kb add` завершится ошибкой.
# tier:    start — минимум для первого запуска, extended — расширение.
# Платные правовые системы не используются и обход платного доступа не предусмотрен.

