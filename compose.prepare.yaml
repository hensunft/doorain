# Подготовка С ИНТЕРНЕТОМ (единственный момент, когда нужна сеть): загрузка локальных моделей в volumes.
# Запуск: scripts/doorain prepare. После этого рабочий стек не ходит наружу (internal-сеть, HF_HUB_OFFLINE=1, OLLAMA_NO_CLOUD=1).
services:
  fetch-hf-models:
    image: doorain/backend:${DOORAIN_VERSION:-0.1.0}
    profiles: ["prepare"]
    user: "0:0"
    networks: [edge]
    environment:
      HF_HUB_OFFLINE: "0"
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - models:/models
      - ./infra/models.lock.json:/app/models.lock.json:ro
    command: ["python", "-m", "app.ops", "fetch-models", "--lock", "/app/models.lock.json", "--dest", "/models"]

  pull-ollama-model:
    image: ollama/ollama:0.34.2@sha256:da6e0dc5651df159e45686fd663c4dbe1624a52c44d7280eeac1551d8f865532
    profiles: ["prepare"]
    networks: [edge]
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      MODEL: ${DOORAIN_OLLAMA_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve >/tmp/ollama.log 2>&1 & for i in $(seq 1 60); do ollama list >/dev/null 2>&1 && break; sleep 1; done; ollama pull \"$$MODEL\" && ollama show \"$$MODEL\""]
networks:
  edge: {}
volumes:
  models:
  ollama:
